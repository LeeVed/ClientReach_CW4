{% extends 'newsletter/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h2>Письмо отправлено</h2>
            </div>
            <div class="card-body">
                <div class="alert alert-success">
                    <h4 class="alert-heading">Проверьте вашу почту!</h4>
                    <p>Мы отправили вам письмо с инструкциями по сбросу пароля. Если вы не получили письмо в течение нескольких минут, проверьте папку "Спам".</p>
                </div>
                <a href="{% url 'newsletter:home' %}" class="btn btn-primary">На главную</a>
                <a href="{% url 'users:login' %}" class="btn btn-link">Вернуться ко входу</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
