{% extends 'newsletter/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h2>Восстановление пароля</h2>
            </div>
            <div class="card-body">
                <p>Введите email, указанный при регистрации. Мы вышлем вам ссылку для сброса пароля.</p>
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_email" class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" id="id_email" 
                               placeholder="Введите ваш email" required>
                        {% if form.email.errors %}
                            <div class="alert alert-danger mt-1">
                                {{ form.email.errors }}
                            </div>
                        {% endif %}
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Отправить ссылку для сброса</button>
                        <a href="{% url 'users:login' %}" class="btn btn-link">Вернуться ко входу</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
