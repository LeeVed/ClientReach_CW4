{% extends 'newsletter/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h2>Пароль успешно изменён</h2>
            </div>
            <div class="card-body">
                <div class="alert alert-success">
                    <h4 class="alert-heading">Успех!</h4>
                    <p>Ваш пароль был успешно изменён. Теперь вы можете войти с новым паролем.</p>
                </div>
                <a href="{% url 'users:login' %}" class="btn btn-primary">Войти в систему</a>
                <a href="{% url 'newsletter:home' %}" class="btn btn-link">На главную</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
